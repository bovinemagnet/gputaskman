[package]
name = "gputaskman"
description = "An htop for what's inside your GPU"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
gputaskman-core = { path = "../gputaskman-core" }
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
gputaskman-linux = { path = "../gputaskman-linux" }
gputaskman-tui = { path = "../gputaskman-tui" }

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.154"
tempfile = "3.27.0"
